{{- /* /sk/ and /cs/: the branch main page, laid out like any other content page. The entrance between the branches is main.html at /. */ -}}
{{ define "main" }}
	<div class="row flex-xl-nowrap">
		<main class="docs-content col-lg-11 col-xl-9 mx-xl-auto">
			<div class="page-header d-flex flex-row justify-content-between align-items-start">
				<div>
					<h1>{{ .Title }}</h1>
				</div>
			</div>
			{{ .Content }}
		</main>
	</div>
{{ end }}
