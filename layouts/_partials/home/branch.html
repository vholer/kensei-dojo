<article class="home-branch home-branch--{{ urlize .city }}">
  <h2 class="home-branch__city"><a class="home-branch__link" href="{{ .cta.url }}">{{ .city }}{{ with .country }}<span class="home-branch__country">{{ partial "flag" (dict "lang" $.lang "class" "home-branch__flag") }}</span>{{ end }}</a></h2>
</article>
